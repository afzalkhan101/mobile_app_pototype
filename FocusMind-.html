if(page==='Check-in')h=`<div class="center"><span class="pill">DAILY CHECK-IN · 1 MIN</span><h1>Build a better you ✨</h1><p class="muted">A quick self-check to personalize your journey.</p></div>${art('intro')}<section class="panel"><label>☻ How are you feeling today?</label><div class="choices mood">${['😣','😕','😐','🙂','😄'].map((v,i)=>`<button data-mood="${i}" class="${profile.mood===i?'selected':''}" aria-label="Mood ${i+1} of 5">${v}</button>`).join('')}</div></section><div class="grid"><section class="panel"><label>◎ Today's main goal</label><select id="goal">${options(['Deep work / Study','Exercise','Reading','Better sleep','Less screen time'],profile.goal)}</select></section><section class="panel"><label>♧ Biggest distraction</label><select id="distraction">${options(['Social media','Gaming','Short videos','Notifications','Other'],profile.distraction)}</select></section></div><section class="panel" style="margin-top:9px"><div class="row"><label>◷ Desired focus time</label><b id="mins">${profile.minutes} min</b></div><input id="minutes" type="range" min="15" max="180" step="15" value="${profile.minutes}"><div class="row muted"><span>15m</span><span>90m</span><span>180m</span></div></section><section class="panel"><label>☾ Sleep quality last night</label><div class="choices">${['Poor','OK','Good'].map(v=>`<button data-sleep="${v}" class="${profile.sleep===v?'selected':''}">${v}</button>`).join('')}</div></section><section class="panel"><label for="intention">✎ Your intention for today</label><textarea id="intention" placeholder="What would make today meaningful?">${esc(profile.intention)}</textarea></section><button class="primary" id="continue">Create my growth plan →</button><p class="center muted">Private to this browser. You can edit your answers.</p>`;
if(page==='Home')h=`<div class="row"><div><h1>Your day, your pace ✨</h1><p class="muted">One small step toward a stronger you.</p></div><button data-page="Check-in" title="Edit check-in">☻</button></div>${art('hero')}<div class="grid"><section class="panel"><div class="ring" style="--p:${pct()}%"><div><strong>${pct()}%</strong><small>Daily progress</small></div></div></section><div style="display:grid;gap:8px"><section class="panel stat"><span style="font-size:25px">🌱</span><div><b>${xp()} XP</b><br><small>Today's growth</small></div></section><section class="panel stat"><span style="font-size:25px">🏆</span><div><b>${sessions} sessions</b><br><small>${focus} focus minutes</small></div></section></div></div><button class="primary focusbar" data-page="Focus"><i>▶</i><span>Focus Timer<br><small style="color:#ded0ed">${esc(profile.goal)} · ${profile.minutes} min goal</small></span></button><section class="panel" style="margin-top:12px"><div class="row"><h2>◎ Today's mission</h2><small>${done.filter(Boolean).length}/3</small></div>${missions().map((v,i)=>`<div class="line"><button class="check ${done[i]?'on':''}" data-mission="${i}" aria-label="Toggle mission ${i+1}">${done[i]?'✓':''}</button><span>${esc(v)}</span><b class="xp">+${[50,30,20][i]} XP</b></div>`).join('')}</section><div class="quick">${[['Focus','◷','Focus mode'],['Journal','✎','Journal'],['Coach','✧','AI Coach'],['Habits','✓','Habits']].map(([p,i,t])=>`<button data-page="${p}"><b>${i}</b>${t}</button>`).join('')}</div>`;
if(page==='Coach')h=`<h1>AI Coach</h1><p class="muted">Your personal growth companion · demo</p><div class="choices">${['My plan','Insights','Chat'].map(t=>`<button data-tab="${t}" class="${tab===t?'selected':''}">${t}</button>`).join('')}</div>${tab==='My plan'?`<div class="coachhero"><img src="${ART.coach}" alt="Sheep coach"><div><h2>Your personalized growth plan ✨</h2><p>Small, achievable steps based on your daily check-in.</p></div></div><div class="row"><h2>Your next 7 days</h2><button data-page="Check-in">Edit plan</button></div><section class="panel"><div class="line"><span>📱</span><span><b>Reduce ${esc(profile.distraction.toLowerCase())}</b><br><small>Set a realistic daily limit</small></span></div><div class="row"><label>Daily limit (minutes)</label><input id="limit" type="number" min="1" max="1440" value="${limit}" style="width:85px"></div></section><section class="panel"><h2>◷ Focus on ${esc(profile.goal)}</h2><p class="muted">Aim for ${profile.minutes} minutes across manageable sessions. Take breaks as needed.</p></section><section class="panel"><h2>☾ Protect your sleep</h2><p class="muted">${profile.sleep==='Poor'?'Keep today\'s plan gentle and prioritize rest.':'Keep a consistent bedtime and allow enough rest.'}</p></section><section class="panel"><h2>✎ Your intention</h2><p>${esc(profile.intention||'Choose one meaningful task today.')}</p></section><button class="primary" id="apply">${applied?'✓ Plan applied — go home':'Apply this 7-day plan ✨'}</button>`:tab==='Insights'?`<section class="panel" style="margin-top:12px"><h2>Your actual progress</h2><p>${focus} focus minutes · ${sessions} completed sessions</p><div class="bar"><i style="width:${Math.min(100,focus/profile.minutes*100)}%"></i></div><p>${pct()}% of today's missions checked.</p><p class="muted">No predicted health outcomes. Results reflect your own activity in this prototype.</p></section>`:`<div id="messages">${messages.map(([r,s])=>`<div class="chat ${r==='user'?'user':''}">${esc(s)}</div>`).join('')}</div><div class="choices">${['I cannot focus','Reduce scrolling','Plan my day'].map(t=>`<button data-prompt="${t}">${t}</button>`).join('')}</div><form id="compose" class="compose"><input id="message" placeholder="Ask your coach…" required><button>Send</button></form><p class="muted">Rule-based prototype, not a live AI service.</p>`}`;
if(page==='Focus')h=`<h1>Deep focus</h1><p class="muted">Make room for what matters.</p><div class="choices">${[25,50,90].map(n=>`<button data-duration="${n}" class="${duration===n?'selected':''}">${n} min</button>`).join('')}</div><div class="timer"><small>${running?'FOCUS SESSION':'READY TO FOCUS'}</small><strong id="clock">${time()}</strong><small>${esc(profile.goal)}</small></div><button class="primary" id="start">${running?'Pause session':'Start focus'}</button><button style="width:100%;margin-top:8px" id="reset">Reset timer</button><p class="center muted">${focus} focus minutes completed · ${sessions} sessions</p>`;
if(page==='Habits')h=`<h1>Small steps, big change</h1><p class="muted">Build habits at your own pace.</p><section class="panel">${['Read 10 pages','Move your body','Take a screen-free break','Prepare for tomorrow'].map((v,i)=>`<div class="line"><button class="check ${habits[i]?'on':''}" data-habit="${i}" aria-label="Toggle ${v}">${habits[i]?'✓':''}</button><span>${v}</span></div>`).join('')}</section><button data-page="Journal" class="primary">Write a reflection</button>`;
if(page==='Journal')h=`<h1>Your reflection</h1><p class="muted">What went well? What could feel easier tomorrow?</p><section class="panel"> <label for="journal">A moment for yourself</label><textarea id="journal" style="min-height:180px" placeholder="Write anything you want…">${esc(journal)}</textarea></section><button class="primary" id="savejournal">Save reflection</button><button data-page="Home" style="margin-top:10px;width:100%">Back home</button>`;
if(page==='Progress')h=`<h1>Look how far you've come</h1><p class="muted">Progress is personal, not a competition.</p><section class="panel"><h2>Today's mission progress</h2><div class="ring" style="--p:${pct()}%"><div><strong>${pct()}%</strong><small>Completed</small></div></div></section><div class="grid"><section class="panel"><small>Focus time</small><h1>${focus}m</h1></section><section class="panel"><small>Growth points</small><h1>${xp()}</h1></section></div><section class="panel" style="margin-top:10px"><h2>Focus goal</h2><div class="bar"><i style="width:${Math.min(100,focus/profile.minutes*100)}%"></i></div><small>${focus} / ${profile.minutes} minutes</small></section><section class="panel"><h2>Example screen time trend</h2><div class="week">${[95,80,105,65,55,68,45].map((v,i)=>`<div><i style="height:${v}px"></i><small>${'MTWTFSS'[i]}</small></div>`).join('')}</div><small>Illustrative data only. Real app usage is not connected.</small></section><button data-page="Check-in">Edit daily check-in</button>`;
if(page==='Check-in'&&!ready)h=h.replace('<button class="primary" id="continue">',`<section class="panel"><h2>◎ Your future starts here</h2><label for="firstLong">Long-term vision</label><input id="firstLong" placeholder="e.g. Become an AI engineer" value="${esc(profile.firstLong||'')}"><label for="firstShort" style="margin-top:10px">First short-term milestone</label><input id="firstShort" placeholder="e.g. Finish Python fundamentals" value="${esc(profile.firstShort||'')}"><small>You can add deadlines and more milestones in Goals.</small></section><button class="primary" id="continue">`);
if(page==='Home')h+=`<section class="panel" style="margin-top:14px"><div class="row"><h2>✦ Your future self</h2><button data-page="Goals">View goals →</button></div>${goals.filter(g=>g.type==='long').slice(0,2).map(goalCard).join('')||'<p class="muted">Give your focus a purpose. Create your first long-term goal.</p>'}<button class="primary" data-page="Goals">Build my roadmap</button></section>`;
if(page==='Goals')h=`<span class="pill">YOUR LIFE ROADMAP</span><h1>Dream big. Start small.</h1><p class="muted">Turn your vision into clear milestones and focused action.</p><div class="coachhero"><img src="${ART.coach}" alt="Sheep mentor"><div><h2>Every session is a step forward.</h2><p>Track effort separately from actual goal completion.</p></div></div><div class="grid"><section class="panel"><small>Long-term goals</small><h1>${goals.filter(g=>g.type==='long').length}</h1></section><section class="panel"><small>Milestones achieved</small><h1>${goals.filter(g=>g.type==='short'&&g.done).length}/${goals.filter(g=>g.type==='short').length}</h1></section></div><button class="primary" data-edit="new">＋ Add a goal</button><h2 style="margin-top:18px">Your long-term vision</h2>${goals.filter(g=>g.type==='long').map(g=>goalCard(g)+children(g.id).map(c=>'<div style="margin-left:18px;border-left:2px solid #d8c4fc;padding-left:9px">'+goalCard(c)+'</div>').join('')).join('')||'<p class="muted">No long-term goals yet.</p>'}<h2>Independent short-term goals</h2>${goals.filter(g=>g.type==='short'&&!g.parent).map(goalCard).join('')||'<p class="muted">No independent milestones.</p>'}`;
if(page==='Edit goal'){let g=goals.find(x=>x.id===editing)||{type:'long',title:'',why:'',date:'',parent:'',target:30,next:''};h=`<h1>${editing==='new'?'Create a goal':'Edit goal'}</h1><p class="muted">Make your next step specific and achievable.</p><form id="goalform"><section class="panel"><label>Goal type</label><select id="gtype" ${editing==='new'?'':'disabled'}><option value="long" ${g.type==='long'?'selected':''}>Long-term vision</option><option value="short" ${g.type==='short'?'selected':''}>Short-term milestone</option></select><label style="margin-top:10px">Goal title</label><input id="gtitle" required maxlength="120" value="${esc(g.title)}"><label style="margin-top:10px">Why does it matter?</label><textarea id="gwhy">${esc(g.why)}</textarea><label>Deadline (optional)</label><input type="date" id="gdate" value="${esc(g.date)}"><label style="margin-top:10px">Parent long-term goal (short-term only)</label><select id="gparent"><option value="">Independent</option>${goals.filter(x=>x.type==='long'&&x.id!==g.id).map(x=>`<option value="${x.id}" ${g.parent===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label style="margin-top:10px">Daily focus target (minutes)</label><input type="number" id="gtarget" min="1" max="1440" required value="${g.target}"><label style="margin-top:10px">Next concrete action</label><textarea id="gnext" placeholder="What can you do next?">${esc(g.next)}</textarea></section><button class="primary" type="submit">Save goal</button></form><button data-page="Goals" style="width:100%;margin-top:8px">Cancel</button>`;}
if(page==='Focus')h=h.replace('<div class="choices">',`<section class="panel"><label for="focusgoal">Which goal are you working toward?</label><select id="focusgoal" ${running||seconds!==duration*60?'disabled':''}><option value="">General focus (no goal)</option>${goals.map(g=>`<option value="${g.id}" ${selectedGoal===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select><label style="margin-top:8px">Specific task</label><input id="focustask" value="${esc(task)}" placeholder="e.g. Solve 3 stack problems" ${running||seconds!==duration*60?'disabled':''}></section><div class="choices">`).replace('<p class="center muted">',`<div class="choices"><button id="disrupted" ${running?'':'disabled'}>Log distraction (${interruptions})</button><button id="finish" ${running||seconds<duration*60?'':'disabled'}>Finish & review</button></div><p class="center muted">`);
if(page==='Review'&&review)h=`<h1>Reflect on your focus</h1><p class="muted">One more step toward your future self.</p><section class="panel"><h2>${fmt(review.seconds)} focused · ${review.interruptions} distractions logged</h2><p>${esc(review.task||'Focus session')}</p><form id="reviewform"><label>How focused did you feel?</label><select id="quality"><option value="5">5 — Very focused</option><option value="4">4 — Mostly focused</option><option value="3" selected>3 — Mixed</option><option value="2">2 — Distracted</option><option value="1">1 — Very distracted</option></select><label style="margin-top:10px">What did you accomplish?</label><textarea id="outcome"></textarea><button class="primary">Save session review</button></form></section>`;
if(page==='Progress')h+=`<section class="panel"><h2>Goal-wise focus tracking</h2>${goals.map(g=>`<div class="line"><div style="flex:1"><b>${esc(g.title)}</b><br><small>${fmt(total(g.id))} total focus · ${progress(g)}% milestone completion</small></div></div>`).join('')||'<p class="muted">Create a goal and link a focus session to it.</p>'}</section><section class="panel"><h2>Last 7 days · logged focus</h2>${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=day(d),n=logs.filter(l=>l.day===k).reduce((a,l)=>a+l.seconds,0);return `<div class="row"><small>${k}</small><b>${fmt(n)}</b></div><div class="bar"><i style="width:${Math.min(100,n/Math.max(1,profile.minutes*60)*100)}%"></i></div>`}).join('')}</section><section class="panel"><h2>Session history</h2>${logs.slice().reverse().slice(0,30).map(l=>`<div class="line"><div><b>${esc(goals.find(g=>g.id===l.goal)?.title||'General focus')}</b><br><small>${l.day} · ${fmt(l.seconds)} · ${l.interruptions} distractions · ${l.quality?l.quality+'/5 self-rating':'Not rated'}</small><p>${esc(l.task||'')}${l.outcome?' — '+esc(l.outcome):''}</p></div></div>`).join('')||'<p class="muted">Your completed sessions will appear here.</p>'}</section>`;
if(page==='Coach'&&tab==='My plan')h+=`<section class="panel" style="margin-top:12px"><h2>✦ Goal-based coaching</h2>${goals.filter(g=>!g.done&&g.type==='short').slice(0,3).map(g=>`<p><b>${esc(g.title)}</b><br>Next action: ${esc(g.next||'Choose one small task')} · aim for ${g.target} minutes today.</p><button data-focusgoal="${g.id}">Focus on this goal →</button>`).join('')||'<p class="muted">Add a milestone to receive a goal-based action suggestion.</p>'}<button data-page="Goals">Manage goals</button></section>`;
$('main').innerHTML=h;}
function reply(s){messages.push(['user',s]);let a=/scroll|social|mobile/i.test(s)?`Try a ${limit}-minute daily limit for ${profile.distraction}. Replace one scrolling session with a short walk.`:/focus/i.test(s)?'Pick one small task and try a 25-minute focus session. Take a break afterward.':/plan|day/i.test(s)?`Today: aim for ${profile.minutes} minutes of ${profile.goal}, take breaks, and write a short reflection.`:`You've logged ${focus} focus minutes and checked ${done.filter(Boolean).length} missions. Choose one realistic next step.`;messages.push(['bot',a]);render()}
document.addEventListener('input',e=>{let x=e.target;if(x.id==='focusgoal'){selectedGoal=x.value;return}else if(x.id==='focustask'){task=x.value;return}else if(x.id==='minutes'){$('mins').textContent=x.value+' min';profile.minutes=+x.value}else if(['goal','distraction','intention','firstLong','firstShort'].includes(x.id))profile[x.id]=x.value;else if(x.id==='limit'&&+x.value>=1&&+x.value<=1440)limit=+x.value;else return;save()});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.edit){editing=b.dataset.edit;page='Edit goal';render()}else if(b.dataset.achieve){let g=goals.find(x=>x.id===b.dataset.achieve);g.done=!g.done;save();render()}else if(b.dataset.focusgoal){if(running||seconds<duration*60){page='Focus';render();return}selectedGoal=b.dataset.focusgoal;task=goals.find(g=>g.id===selectedGoal)?.next||'';page='Focus';render()}else if(b.id==='disrupted'){interruptions++;render()}else if(b.id==='finish'){finishSession()}else if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0)}else if(b.dataset.mood!==undefined){profile.mood=+b.dataset.mood;save();render()}else if(b.dataset.sleep){profile.sleep=b.dataset.sleep;save();render()}else if(b.id==='continue'){if(!ready){let parent='';if(profile.firstLong?.trim()){parent=uid();goals.push({id:parent,type:'long',title:profile.firstLong.trim(),why:'',date:'',parent:'',target:profile.minutes,next:'',done:false})}if(profile.firstShort?.trim())goals.push({id:uid(),type:'short',title:profile.firstShort.trim(),why:'',date:'',parent,target:profile.minutes,next:'',done:false})}ready=true;page='Coach';tab='My plan';save();render();window.scrollTo(0,0)}else if(b.id==='apply'){applied=true;page='Home';save();render();window.scrollTo(0,0)}else if(b.dataset.mission!==undefined){let i=+b.dataset.mission;done[i]=!done[i];save();render()}else if(b.dataset.habit!==undefined){let i=+b.dataset.habit;habits[i]=!habits[i];save();render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.duration){if(running||seconds<duration*60)return;duration=+b.dataset.duration;seconds=duration*60;interruptions=0;running=false;render()}else if(b.id==='start'){if(running){seconds=Math.max(1,Math.ceil((deadline-Date.now())/1000));running=false}else{if(!seconds)seconds=duration*60;deadline=Date.now()+seconds*1000;running=true}render()}else if(b.id==='reset'){running=false;seconds=duration*60;interruptions=0;render()}else if(b.id==='savejournal'){journal=$('journal').value.trim();if(journal)done[2]=true;save();page='Home';render()}else if(b.dataset.prompt)reply(b.dataset.prompt)});document.addEventListener('submit',e=>{if(e.target.id==='goalform'){e.preventDefault();let old=goals.find(g=>g.id===editing),type=old?.type||$('gtype').value,title=$('gtitle').value.trim();if(!title)return;let g={id:old?.id||uid(),type,title,why:$('gwhy').value,date:$('gdate').value,parent:type==='short'?$('gparent').value:'',target:+$('gtarget').value,next:$('gnext').value,done:old?.done||false};if(old)Object.assign(old,g);else goals.push(g);save();page='Goals';render()}else if(e.target.id==='reviewform'&&review){e.preventDefault();review.quality=+$('quality').value;review.outcome=$('outcome').value;review=null;save();page='Progress';render()}else if(e.target.id==='compose'){e.preventDefault();let s=$('message').value.trim();if(s)reply(s)}});setInterval(()=>{if(!running)return;seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));if($('clock'))$('clock').textContent=time();if(!seconds){finishSession()}},250);render();})();</script></body></html>
