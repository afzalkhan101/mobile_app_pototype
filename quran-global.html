function toggleLifeLanguage(){lifeLanguage=(lifeLanguage??(lang==='Bangla'||trans==='Bangla'?'bn':'en'))==='bn'?'en':'bn';render();document.getElementById('life-lang')?.focus()}
function renderLife(){const bn=(lifeLanguage??(lang==='Bangla'||trans==='Bangla'?'bn':'en'))==='bn',t=lifeTopics[lifeTopic];return `<section lang="${bn?'bn':'en'}"><div class="life-top"><button onclick="go('home')">← ${bn?'হোম':'Home'}</button><button id="life-lang" onclick="toggleLifeLanguage()">${bn?'English':'বাংলা'}</button></div><div class="life-header"><h1>Quran for Your Life</h1><p>${bn?'জীবনের প্রতিটি মুহূর্তে কুরআনের দিকনির্দেশনা খুঁজুন।':'Find guidance for every moment of life.'}</p></div><h2>${bn?'আজ তুমি কেমন অনুভব করছ?':'How are you feeling today?'}</h2><div class="life-grid" role="group" aria-label="${bn?'পরিস্থিতি নির্বাচন':'Select a situation'}">${lifeTopics.map((x,i)=>`<button id="life-topic-${i}" class="life-topic" aria-pressed="${i===lifeTopic}" onclick="chooseLife(${i})"><span aria-hidden="true">${uiIcon(['sad','fear','patience','leaf','work','heart'][i])}</span>${x[bn?1:2]}</button>`).join('')}</div><div class="life-result" aria-live="polite"><small>${bn?'সম্পর্কিত আয়াত':'RELATED QURANIC VERSE'} · ${t[3]}</small><p>${t[bn?5:6]}</p><small>${bn?'আংশিক ভাবার্থ — পূর্ণ আয়াত, প্রেক্ষাপট ও তাফসির পড়ুন।':'Partial paraphrase — read the full verse, context and tafsir.'}</small><a href="https://quran.com/${t[4]}" target="_blank" rel="noopener noreferrer">${bn?'পূর্ণ আয়াত পড়ুন':'Read full Ayah'} ↗</a></div></section>`}

function render(){document.getElementById('app').classList.toggle('dark',dark);document.getElementById('nav').innerHTML=['home','quran','saved','settings'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><b>${uiIcon(['home','book','heart','settings'][i])}</b>${(dict[lang]||dict.English)[i]}</button>`).join('');let s=surahs.find(x=>x[0]===selected)||surahs[0];if(page==='home')el.innerHTML=`<div class="home-intro"><small class="eyebrow">ASSALAMU ALAIKUM</small><h1>Your daily Quran</h1><p>A moment of peace, a moment with the Quran.</p></div><div class="hero"><small>CONTINUE READING</small><h1>${esc(s[1])}</h1><p>Reconnect with the words of Allah.</p><button onclick="read(${selected})">Read Quran →</button></div><button class="life-entry" onclick="go('life')"><span aria-hidden="true">${uiIcon('leaf')}</span><div><strong>Quran for Your Life</strong><small>${lang==='Bangla'?'জীবনের পরিস্থিতি অনুযায়ী আয়াত খুঁজুন':'Find Quranic guidance for your situation'}</small></div><span class="arrow" aria-hidden="true">›</span></button><h2>Explore</h2><div class="grid">${tile('book','Read Quran','quran')}${tile('audio','Recitations','audio')}${tile('clock','Prayer times','prayer')}${tile('compass','Qibla','qibla')}${tile('counter','Tasbih','tasbih')}${tile('heart','Bookmarks','saved')}</div><div class="support-card"><h2>♡ Support Quran Global</h2><p>Free Quran for everyone. If you wish, help us keep it accessible worldwide.</p><button onclick="go('support')">Support our mission</button></div><h2>Popular Surahs</h2>${rows(surahs.slice(0,3))}`;if(page==='life')el.innerHTML=renderLife();
if(page==='quran')el.innerHTML=`<h1>Holy Quran</h1><small>${surahs.length} Surahs loaded</small><input placeholder="Search Surah" oninput="document.getElementById('list').innerHTML=rows(surahs.filter(s=>s.join(' ').toLowerCase().includes(this.value.toLowerCase())))"><div id="list">${rows(surahs)}</div>`;if(page==='read')el.innerHTML=`<button onclick="go('quran')">← All Surahs</button><h1>${esc(s[1])}</h1>${cache[selected]?cache[selected].map((a,i)=>`<div class="verse"><small>${selected}:${i+1}</small><button style="float:right" onclick="save(${selected},${i+1})">${saved.includes(selected+':'+(i+1))?'♥':'♡'}</button><div class="arabic" style="font-size:${font}px">${esc(a.text)}</div>${a.translation?`<p>${esc(a.translation)}</p>`:''}</div>`).join(''):'<div class="notice">Loading Quran text from API. Internet required.</div><button onclick="load(selected)">Retry</button>'}`;if(page==='saved')el.innerHTML='<h1>Bookmarks</h1>'+(saved.length?saved.map(k=>`<button class="item" onclick="read(${Number(k.split(':')[0])})">Ayah ${k}</button>`).join(''):'<p>No bookmarks yet.</p>');if(page==='settings')el.innerHTML=`<h1>Settings</h1><h2>Interface language</h2><select onchange="setLang(this.value)">${langs.map(l=>`<option ${l===lang?'selected':''}>${l}</option>`).join('')}</select><small>65 language targets; four navigation locales demonstrated.</small><h2>Quran translation</h2><select onchange="setTrans(this.value)">${langs.map(l=>`<option ${l===trans?'selected':''}>${l}</option>`).join('')}</select><small>Live translation demo: Bangla and English only.</small><h2>Appearance</h2><button onclick="dark=!dark;localStorage.dark=dark;render()">${dark?'Light':'Dark'} mode</button><h2>Arabic font size</h2><input type="range" min="22" max="48" value="${font}" oninput="font=+this.value"><h2>Support &amp; About</h2><button class="item" onclick="go('support')">♡ Support Quran Global <span>›</span></button><div class="notice">HTML prototype • Not a production app. Content licensing and full localization pending.</div>`;if(page==='support')el.innerHTML=`<button onclick="go('home')">← Home</button><div class="support-intro"><div class="support-icon">♡</div><h1>Support Quran Global</h1><p>Help us keep the Quran accessible to everyone, everywhere.</p><small>All features are free. Supporting us is entirely optional.</small></div><label class="support-field" for="currency">Currency</label><select id="currency" onchange="changeCurrency(this.value)"><option value="USD" ${donationCurrency==='USD'?'selected':''}>USD — US Dollar</option><option value="BDT" ${donationCurrency==='BDT'?'selected':''}>BDT — Bangladeshi Taka</option></select><h2>Choose your contribution</h2><div class="amount-grid">${(donationCurrency==='USD'?['1','5','10','20','50','custom']:['50','100','250','500','1000','custom']).map(a=>`<button aria-pressed="${donationAmount===a}" class="${donationAmount===a?'chosen':''}" onclick="chooseDonation('${a}')">${a==='custom'?'Custom':(donationCurrency==='USD'?'$':'৳')+a}</button>`).join('')}</div>${donationAmount==='custom'?`<label class="support-field" for="customAmount">Custom amount</label><input id="customAmount" type="number" min="0.01" step="0.01" value="${esc(customDonation)}" placeholder="Enter amount" oninput="customDonation=this.value;updateDonation()">`:''}<div class="support-card"><h2>Your support helps with</h2><ul class="support-list"><li>App development and maintenance</li><li>Server and audio costs</li><li>More language support</li><li>Keeping Quran Global free</li></ul></div><label class="support-field" for="paymentMethod">Preferred payment method (preview)</label><select id="paymentMethod" onchange="donationMethod=this.value;updateDonation()"><option value="">Choose method</option>${(donationCurrency==='BDT'?['bKash','Nagad','Card','Bank transfer']:['Card','Bank transfer']).map(m=>`<option ${donationMethod===m?'selected':''}>${m}</option>`).join('')}</select><button id="supportPay" class="support-primary" onclick="previewDonation()">Continue</button><button class="support-secondary" onclick="go('home')">Maybe later</button><div id="paymentPreview" aria-live="polite"></div><p class="support-note muted">Prototype only. No money is collected. Payment providers and compliance must be verified before launch.</p>`;if(page==='support')updateDonation();if(page==='audio')el.innerHTML=`<h1>Recitations</h1><div class="hero"><small>RECITER</small><h1>Mishary Alafasy</h1><p>${esc(s[1])}</p></div><p>Stream selected Surah</p><audio controls preload="none" src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${selected}.mp3"></audio>`;if(page==='prayer')el.innerHTML='<h1>Prayer times</h1><div class="notice">Layout preview; live timings not connected.</div>'+['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].map(n=>`<div class="item prayer-row">◷ ${n}<span>--:--</span></div>`).join('');if(page==='qibla')el.innerHTML='<h1>Qibla direction</h1><div style="margin:30px auto;border:2px solid #9ebcaa;border-radius:50%;width:240px;height:240px;display:grid;place-items:center;font-size:70px;color:#ba9c59">◈</div><div class="notice">Compass preview only; not a real direction reading.</div>';if(page==='tasbih')el.innerHTML=`<h1>Digital Tasbih</h1><p style="text-align:center">سُبْحَانَ اللَّهِ</p><button class="counter" onclick="count++;render()">${count}</button><button onclick="count=0;render()">Reset</button>`}function changeCurrency(v){donationCurrency=v;donationAmount=v==='USD'?'5':'100';customDonation='';donationMethod='';render()}function chooseDonation(v){donationAmount=v;render()}function getDonation(){return Number(donationAmount==='custom'?customDonation:donationAmount)}function updateDonation(){const b=document.getElementById('supportPay');if(!b)return;const a=getDonation();const valid=Number.isFinite(a)&&a>0&&a<=1000000&&Math.abs(a*100-Math.round(a*100))<0.000001;b.disabled=!valid;b.textContent=valid?'Continue • '+(donationCurrency==='USD'?'$':'৳')+a.toLocaleString('en-US',{maximumFractionDigits:2}):'Enter a valid amount';document.getElementById('paymentPreview').innerHTML=''}function previewDonation(){const a=getDonation();if(!Number.isFinite(a)||a<=0)return;const p=document.getElementById('paymentPreview');p.innerHTML='<div class="support-preview">'+(!donationMethod?'Please choose a preferred payment method.':'Contribution preview: '+esc(donationCurrency)+' '+esc(a.toFixed(2))+' via '+esc(donationMethod)+'. No payment was made. Thank you for considering supporting Quran Global.')+'</div>'}
async function load(n){try{const edition={Bangla:'bn.bengali',English:'en.sahih'}[trans];const response=await fetch('https://api.alquran.cloud/v1/surah/'+n+(edition?'/editions/quran-uthmani,'+edition:'/quran-uthmani'));const j=await response.json();const d=Array.isArray(j.data)?j.data[0]:j.data;cache[n]=d.ayahs.map((a,i)=>({...a,translation:Array.isArray(j.data)?j.data[1].ayahs[i].text:null}));if(page==='read'&&selected===n)render()}catch(e){if(page==='read'&&selected===n)el.innerHTML+='<p class="notice">Could not load data. Check internet connection and retry.</p>'}}render();fetch('https://api.alquran.cloud/v1/surah').then(r=>r.json()).then(j=>{surahs=j.data.map(s=>[s.number,s.englishName,s.name,s.numberOfAyahs]);render()}).catch(()=>{});
</script></html>
