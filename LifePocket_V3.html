function extraPage(p){let a=S[p]||[],title=pages.find(x=>x[0]===p)[2];let head=(label,amount)=>`<div class="card hero"><div class="muted">${label}</div><div class="big">${amount}</div></div>`;let rows='';if(p==='habits'){rows=empty(a,x=>`<div class="line"><input type="checkbox" class="check" ${x.checks.includes(today())?'checked':''} onchange="habit(${x.id})"><div class="grow"><b>${esc(x.name)}</b><div class="muted">মোট ${x.checks.length} দিন সম্পন্ন</div></div>${btn('✕',`remove('habits',${x.id})`,'smallbtn')}</div>`);return head('আজ সম্পন্ন',a.filter(x=>x.checks.includes(today())).length+' / '+a.length)+sectionExtra(p,title,rows)}if(p==='shopping')return head('আনুমানিক বাজার খরচ',money(a.reduce((n,x)=>n+x.amount,0)))+sectionExtra(p,title,empty(a,x=>task({...x,date:'বাজারের তালিকা'},p)));if(p==='notes')return sectionExtra(p,title,empty(a,x=>`<div class="line"><div class="grow"><b>${esc(x.name)}</b><p class="muted">${esc(x.detail)}</p></div>${btn('✕',`remove('notes',${x.id})`,'smallbtn')}</div>`));if(p==='subscriptions')return head('মাসিক পুনরাবৃত্ত খরচ',money(a.reduce((n,x)=>n+x.amount,0)))+sectionExtra(p,title,empty(a,x=>`<div class="line"><div class="grow"><b>${esc(x.name)}</b><div class="muted">পরবর্তী তারিখ: ${esc(displayDate(x.date))}</div></div><b>${money(x.amount)}</b>${btn('✕',`remove('subscriptions',${x.id})`,'smallbtn')}</div>`));if(p==='lifeGoals')return sectionExtra(p,title,empty(a,x=>`<div class="line" style="display:block"><b>${esc(x.name)}</b><div class="muted">${esc(x.detail)}</div><div class="bar"><i style="width:${x.saved}%"></i></div><p>${x.saved}% সম্পন্ন</p>${btn('+ 10%',`progress(${x.id})`,'secondary')} ${btn('✕',`remove('lifeGoals',${x.id})`,'smallbtn')}</div>`));return `<div class="card ai"><span class="pill">ফোকাস রুম</span><h2 style="margin-top:12px">এক সময়ে এক কাজ</h2><div class="timer" id="clock">25:00</div><div class="two">${btn('শুরু / বিরতি','runTimer()')}${btn('রিসেট','resetTimer()','secondary')}</div><div class="note">২৫ মিনিটের ফোকা let seconds=1500, interval=null, deadline=0;function paintTimer(){if($('clock'))$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function runTimer(){if(interval){clearInterval(interval);interval=null;return}if(!seconds)seconds=1500;deadline=Date.now()+seconds*1000;interval=setInterval(()=>{seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));paintTimer();if(!seconds){clearInterval(interval);interval=null;S.focusLog.unshift({date:today()});save();notify('ফোকাস সেশন সম্পন্ন!')}},250)}function resetTimer(){clearInterval(interval);interval=null;seconds=1500;paintTimer()}
function csv(){let q=v=>'"'+String(v).replaceAll('"','""')+'"';let data=['Date,Name,Type,Category,Amount',...S.tx.map(x=>[x.date,x.name,x.type,x.cat,x.amount].map(q).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));a.download='LifePocket-transactions.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function remove(k,id){if(confirm('এই এন্ট্রিটি মুছে ফেলবেন?')){S[k]=S[k].filter(x=>x.id!==id);save();notify('এন্ট্রি সরানো হয়েছে')}}function toggle(k,id){let x=S[k].find(x=>x.id===id);x.done=!x.done;save()}function field(n,t,type='text',v='',extra=''){return `<label for="f-${n}">${t}</label><input id="f-${n}" name="${n}" type="${type}" value="${esc(v)}" required ${extra}>`}function select(n,t,opts){return `<label for="f-${n}">${t}</label><select id="f-${n}" name="${n}">${opts.map(o=>`<option value="${esc(Array.isArray(o)?o[0]:o)}">${esc(Array.isArray(o)?o[1]:o)}</option>`).join('')}</select>`}function openForm(k,id){let titles={expense:'খরচ লিখুন করুন',income:'আয় লিখুন করুন',goal:'নতুন সঞ্চয়ের লক্ষ্য',saving:'সঞ্চয় যোগ করুন',task:'নতুন কাজ',bill:'নতুন বিল',debt:'পাওনা বা দেনা',budget:'মাসিক বাজেট'};$('mt').textContent=titles[k];let html='';if(['expense','income'].includes(k))html=field('name','বিবরণ')+field('amount','টাকা','number','','min="0.01" step="0.01"')+select('cat','বিভাগ',k==='income'?['বেতন','ব্যবসা','অন্যান্য']:['খাবার','বাসা','যাতায়াত','স্বাস্থ্য','শিক্ষা','বিনোদন','অন্যান্য'])+field('date','তারিখ','date',today());if(k==='goal')html=field('name','লক্ষ্যের নাম')+field('target','লক্ষ্যমাত্রা','number','','min="1" step="0.01"');if(k==='saving'||k==='budget')html=field('amount','টাকা','number',k==='budget'?S.budget:'','min="0.01" step="0.01"');if(k==='task'||k==='bill')html=field('name','বিবরণ')+(k==='bill'?field('amount','টাকা','number','','min="0.01" step="0.01"'):'')+field('date','তারিখ','date',today());if(k==='debt')html=field('name','নাম')+field('amount','টাকা','number','','min="0.01" step="0.01"')+select('type','ধরন',[['receive','পাব'],['pay','দেব']]);$('form').innerHTML=html+'<button class="primary" type="submit">সংরক্ষণ করুন</button>';$('form').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(x.name&&!x.name.trim()){notify('বিবরণ লিখুন');return}if(x.amount)x.amount=Number(x.amount);if(x.target)x.target=Number(x.target);x.id=Date.now();if(k==='expense'||k==='income')S.tx.push({...x,type:k});if(k==='goal')S.goals.push({...x,saved:0});if(k==='saving')S.goals.find(g=>g.id===id).saved+=x.amount;if(k==='budget')S.budget=x.amount;if(k==='task')S.tasks.push({...x,done:false});if(k==='bill')S.bills.push({...x,done:false});if(k==='debt')S.debts.push(x);$('modal').close();save();notify('সফলভাবে সংরক্ষণ হয়েছে')};$('modal').showModal()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='LifePocket-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetData(){if(confirm('সব পরিবর্তন মুছে ডেমো ডাটা ফেরত আনবেন?')){S=structuredClone(seed);for(const [k,v] of Object.entries(extras))S[k]=structuredClone(v);document.body.classList.remove('dark');save();notify('ডেমো পুনরায় সেট হয়েছে')}}render();</script></body></html>
